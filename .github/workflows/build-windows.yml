name: Build STRATA NULL Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          curl -fL -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates
          unzip -q templates.tpz -d /tmp/godot_templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Import and validate project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" import.log

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euxo pipefail
          timeout 12s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -- --smoke-test 2>&1 | tee runtime.log || code=$?
          code=${code:-0}
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi
          ! grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR:" runtime.log
          grep -q "STRATA_SMOKE_READY" runtime.log

      - name: Export Windows single EXE
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/STRATA_NULL.exe 2>&1 | tee export.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" export.log
          test -s build/STRATA_NULL.exe
          file build/STRATA_NULL.exe
          sha256sum build/STRATA_NULL.exe > build/SHA256.txt

      - name: Package runnable ZIP
        shell: bash
        run: |
          set -euxo pipefail
          cp runtime.log build/RUNTIME_SMOKE_TEST.txt
          cd build
          zip -9 STRATA_NULL_Prototype_021_RUNNABLE.zip STRATA_NULL.exe SHA256.txt RUNTIME_SMOKE_TEST.txt

      - name: Upload runnable artifact
        uses: actions/upload-artifact@v4
        with:
          name: STRATA_NULL_Prototype_021_RUNNABLE
          path: build/STRATA_NULL_Prototype_021_RUNNABLE.zip
          if-no-files-found: error
          retention-days: 14
